<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Університет</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500&amp;family=Caveat:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="css/university.css" rel="stylesheet"/>
</head>
<body>
    <section class="university-view is-visible" id="university-view">
        <div class="university-scene" id="universityScene">
            <div class="university-confirm-popup" id="universityDeleteConfirm">
                <p class="university-confirm-text">Видалити цей запис? Дію не можна скасувати.</p>
                <div class="university-confirm-actions">
                    <button class="university-confirm-btn university-confirm-btn--cancel" id="universityDeleteCancel" type="button">Скасувати</button>
                    <button class="university-confirm-btn university-confirm-btn--delete" id="universityDeleteConfirmBtn" type="button">Видалити</button>
                </div>
            </div>

            <div class="university-notebook-wrap">
                    <button class="university-back" id="universityBack" type="button" title="Назад">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="11 6 5 12 11 18"/></svg>
                    </button>
                    <button class="university-page-arrow university-page-arrow--prev" id="universityPrevEntry" type="button" title="Попередній запис">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 5 8 12 15 19"/></svg>
                    </button>
                    <div class="university-notebook" id="universityNotebook">
                        <div class="university-notebook-spread">
                        <div class="university-notebook-page university-notebook-page--left">
                            <div class="university-page-content">
                                <div class="university-entry-text" id="universityEntryText" contenteditable="true"></div>
                            </div>
                        </div>
                        <div class="university-notebook-fold"></div>
                        <div class="university-notebook-page university-notebook-page--right">
                            <div class="university-page-content">
                                <div class="university-entry-text" id="universityEntryTextRight" contenteditable="true"></div>
                            </div>
                            <div class="university-page-number" id="universityPageNumber">
                                <svg class="university-page-number-blot" viewBox="0 0 100 70">
                                    <path d="M24,36 C14,28 12,14 27,8 C36,-1 58,1 62,11 C74,8 86,18 80,28 C92,30 91,47 78,49 C74,60 56,65 46,57 C32,64 16,55 20,44 C10,43 12,33 24,36 Z"/>
                                    <circle cx="88" cy="14" r="3.4"/>
                                    <circle cx="93" cy="22" r="1.8"/>
                                    <circle cx="10" cy="52" r="2.2"/>
                                </svg>
                                <span class="university-page-number-text" id="universityPageNumberText">2</span>
                            </div>
                        </div>
                        </div>
                    </div>
                    <button class="university-page-arrow university-page-arrow--next" id="universityNextEntry" type="button" title="Наступний запис">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 5 16 12 9 19"/></svg>
                    </button>
                    <button class="university-notebook-delete" id="universityDeleteEntry" type="button" title="Видалити запис">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 20 7"/><path d="M9 7V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
                    </button>
                    <button class="university-notebook-add" id="universityNewEntry" type="button" title="Новий запис">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    </button>
                    <div class="university-format-toolbar" id="universityFormatToolbar">
                        <button class="university-format-btn" type="button" data-format="paragraph" title="Абзац">¶</button>
                        <button class="university-format-btn" type="button" data-format="list" title="Нумерований перелік">1.</button>
                        <button class="university-format-btn" type="button" data-format="center" title="По центру">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                        </button>
                    </div>
                </div>
        </div>
    </section>
    <script src="js/university.js"></script>
    <script src="../system/page-navigation.js"></script>
</body>
</html>
