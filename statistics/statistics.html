<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Статистика</title>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin=""/>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
    <link href="statistics.css" rel="stylesheet"/>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <button class="brand-icon brand-icon-back" id="topbarBack" type="button">←</button>
                <div class="brand-title">Журнал угод</div>
            </div>
            <div class="top-actions">
                <button class="backup-btn" hidden="" id="cloudSyncBtn" title="Синхронізація між пристроями" type="button">☁ Увійти</button>
                <button class="backup-btn" id="exportBtn" title="Зберегти резервну копію даних" type="button">⤓ Зберегти копію</button>
                <button class="backup-btn" id="importBtn" title="Відновити дані з файлу" type="button">⤒ Відновити</button>
                <input accept="application/json" hidden="" id="importFile" type="file"/>
                <div class="top-date" id="currentTime">00:00:00</div>
            </div>
        </header>

        <main class="dashboard">
            <section class="left-col">
                <div class="panel">
                    <div class="panel-head">
                        <div class="panel-title">В наявності <span class="badge" id="inventoryBadge">0 шт</span></div>
                    </div>
                    <div class="table-scroll">
                    <table class="inventory-table">
                        <thead>
                            <tr>
                                <th>Назва</th><th>Кількість</th><th>Купив за 1 шт</th><th>Дії</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryBody"></tbody>
                    </table>
                    </div>
                    <div class="inventory-summary" id="inventorySummary"></div>
                </div>
                <div class="panel">
                    <div class="panel-head">
                        <div class="panel-title">Продажі по днях</div>
                        <button class="backup-btn" id="collapseAllDaysBtn" title="Згорнути всі дні" type="button">⊟ Згорнути всі</button>
                    </div>
                    <div id="dailySales"></div>
                </div>
            </section>

            <section class="right-col">
                <div class="kpis" id="statsGrid"></div>
                <div class="panel chart-panel">
                    <div class="chart-toolbar">
                        <div>
                            <div class="chart-heading">Динаміка прибутку</div>
                            <div class="chart-main" id="chartCurrent">+0</div>
                        </div>
                        <div class="chart-period" id="chartPeriodWrap">
                            <select class="chart-period-native" id="chartPeriod">
                                <option value="today">Сьогодні</option>
                                <option value="week">Тиждень</option>
                                <option value="month">Місяць</option>
                                <option selected="" value="all">За весь час</option>
                            </select>
                            <button class="chart-period-trigger" id="chartPeriodTrigger" type="button">За весь час</button>
                            <div class="chart-period-menu" id="chartPeriodMenu">
                                <button class="chart-period-option" data-value="today" type="button">Сьогодні</button>
                                <button class="chart-period-option" data-value="week" type="button">Тиждень</button>
                                <button class="chart-period-option" data-value="month" type="button">Місяць</button>
                                <button class="chart-period-option active" data-value="all" type="button">За весь час</button>
                            </div>
                        </div>
                    </div>
                    <div class="chart-box">
                        <svg id="chartSvg" preserveaspectratio="none" viewbox="0 0 900 300"></svg>
                    </div>
                    <div class="chart-meta" id="chartMeta"></div>
                </div>
                <div class="panel operation theme-buy">
                    <div class="operation-head">
                        <div class="operation-title">Додати операцію</div>
                        <button class="add-btn" id="entrySubmitBtn" title="Додати" type="submit" form="entryForm"><span class="add-btn-icon">＋</span><span class="add-btn-text">Додати</span></button>
                    </div>
                    <div class="form-shell">
                        <form id="entryForm">
                            <div class="op-fields">
                                <div class="form-field" id="fBuyRowsField">
                                    <div class="buy-rows" id="buyRows"></div>
                                </div>
                            </div>
                            <button class="add-row-btn" id="addBuyRowBtn" type="button"><span class="add-row-btn-icon">＋</span>Додати ще один кейс</button>
                            <div class="form-error" id="formError"></div>
                        </form>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-head">
                        <div class="panel-title">Топ-3 кейси</div>
                    </div>
                    <div class="top-cases-list" id="topCasesList"></div>
                </div>
            </section>
        </main>
    </div>

    <div class="sell-modal-backdrop" id="editSaleModal">
        <div class="sell-modal">
            <div class="sell-modal-head">
                <div class="sell-modal-title">Редагувати продаж</div>
                <button class="sell-close" id="editSaleClose" type="button">×</button>
            </div>
            <div class="sell-form">
                <div class="sell-field" style="grid-column:1/-1">
                    <label>Кейс</label>
                    <select id="editSaleCase"></select>
                </div>
                <div class="sell-field">
                    <label>Кількість, шт</label>
                    <input autocomplete="off" id="editSaleQty" inputmode="numeric" type="text"/>
                </div>
                <div class="sell-field">
                    <label>Отримав за все, ₴</label>
                    <input id="editSalePrice" inputmode="decimal"/>
                </div>
            </div>
            <div class="sell-error" id="editSaleError"></div>
            <div class="sell-actions">
                <button class="sell-cancel" id="editSaleCancel" type="button">Скасувати</button>
                <button class="sell-confirm" id="editSaleConfirm" type="button">Зберегти</button>
            </div>
        </div>
    </div>
    <div class="sell-modal-backdrop" id="editBuyModal">
        <div class="sell-modal">
            <div class="sell-modal-head">
                <div class="edit-buy-head">
                    <div class="edit-buy-name" id="editBuyName"></div>
                </div>
                <button class="sell-close" id="editBuyClose" type="button">×</button>
            </div>
            <div class="price-row-head">
                <div>К-сть</div><div>Ціна за штуку</div><div>Сума, ₴</div>
            </div>
            <div id="editBuyRows"></div>
            <div class="price-row-total" id="editBuyTotal"></div>
            <div class="sell-error" id="editBuyError"></div>
            <div class="sell-actions">
                <button class="sell-cancel" id="editBuyCancel" type="button">Скасувати</button>
                <button class="sell-confirm" id="editBuyConfirm" type="button">Зберегти</button>
            </div>
        </div>
    </div>
    <div class="sell-modal-backdrop" id="caseBuysModal">
        <div class="sell-modal">
            <div class="sell-modal-head">
                <div class="sell-modal-title">Продано кейсів за весь час</div>
                <button class="sell-close" id="caseBuysClose" type="button">×</button>
            </div>
            <div class="case-buys-wrap">
                <table class="case-buys-table">
                    <thead>
                        <tr><th>Назва</th><th>Продано</th></tr>
                    </thead>
                    <tbody id="caseBuysBody"></tbody>
                </table>
            </div>
            <div class="case-buys-total" id="caseBuysTotal"></div>
        </div>
    </div>
    <div class="sell-modal-backdrop" id="authModal">
        <div class="sell-modal">
            <div class="sell-modal-head">
                <div class="sell-modal-title">Синхронізація між пристроями</div>
                <button class="sell-close" id="authClose" type="button">×</button>
            </div>
            <div class="sell-form">
                <div class="sell-field" style="grid-column:1/-1">
                    <label>Email</label>
                    <input autocomplete="email" id="authEmail" type="email"/>
                </div>
                <div class="sell-field" style="grid-column:1/-1">
                    <label>Пароль</label>
                    <input autocomplete="current-password" id="authPassword" type="password"/>
                </div>
            </div>
            <div class="sell-error" id="authError"></div>
            <div class="sell-actions">
                <button class="sell-cancel" id="authRegisterBtn" type="button">Зареєструватися</button>
                <button class="sell-confirm" id="authSignInBtn" type="button">Увійти</button>
            </div>
        </div>
    </div>
    <template id="buyRowTemplate">
        <div class="buy-row" data-mode="buy">
            <div class="buy-row-field buy-row-mode-field">
                <label class="buy-row-label">Тип</label>
                <div class="buy-row-mode">
                    <button class="buy-row-mode-btn active" data-row-mode="buy" type="button"><span class="buy-row-mode-icon">↓</span>Купівля</button>
                    <button class="buy-row-mode-btn" data-row-mode="sell" type="button"><span class="buy-row-mode-icon">↑</span>Продаж</button>
                </div>
            </div>
            <div class="buy-row-field buy-row-name-field">
                <label class="buy-row-label">Назва кейса</label>
                <input class="buy-row-name" type="text"/>
                <select class="buy-row-case-select" hidden="">
                    <option value="">Оберіть кейс</option>
                </select>
                <div class="buy-row-suggest" hidden=""></div>
            </div>
            <div class="buy-row-field buy-row-qty-field">
                <label class="buy-row-label">К-сть, шт</label>
                <input class="buy-row-qty" inputmode="numeric"/>
            </div>
            <div class="buy-row-field">
                <label class="buy-row-label">Дата</label>
                <input class="buy-row-date" type="date"/>
            </div>
            <div class="buy-row-field buy-row-sum-field">
                <label class="buy-row-label buy-row-sum-label">Сума за все, ₴</label>
                <input class="buy-row-buy" inputmode="decimal"/>
            </div>
            <div class="buy-row-field buy-row-remove-field">
                <label class="buy-row-label buy-row-label-spacer" aria-hidden="true">&nbsp;</label>
                <button class="buy-row-remove" title="Видалити рядок" type="button">×</button>
            </div>
        </div>
    </template>

    <template id="priceRowTemplate">
        <div class="price-row">
            <input class="price-row-qty" inputmode="numeric" placeholder="К-сть"/>
            <div class="price-row-unit"><span class="price-row-unit-value"></span><span class="price-row-unit-suffix"> ₴/шт</span></div>
            <input class="price-row-sum" inputmode="decimal" placeholder="Сума, ₴"/>
            <button class="price-row-remove" aria-label="Видалити" title="Видалити" type="button">×</button>
        </div>
    </template>

    <template id="priceTotalTemplate">
        <div class="price-total-label">Разом</div>
        <div class="price-total-qty"></div>
        <div class="price-total-sep"></div>
        <div class="price-total-avg">~ <span class="price-total-avg-value"></span> ₴/шт</div>
        <div class="price-total-sep" style="margin-left:auto"></div>
        <div class="price-total-sum"></div>
    </template>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="statistics.js"></script>
</body>
</html>
