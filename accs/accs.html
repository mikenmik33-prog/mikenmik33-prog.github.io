<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Акси — каталог і ціни</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500..700;1,9..144,500..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="accs.css">
</head>
<body>

<div class="topbar">
    <a href="../system/index.html" class="topbar-back" title="Назад">←</a>
    <div class="topbar-title">
        Каталог
    </div>
</div>

<div class="page-shell">

    <div class="filters">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input id="searchInput" type="text" placeholder="Пошук за назвою або описом...">
        </div>
        <div class="category-chips">
            <button class="chip active" type="button" data-category="all"><span class="dot"></span>Всі</button>
            <button class="chip" type="button" data-category="skins"><span class="dot"></span>Скіни</button>
            <button class="chip" type="button" data-category="cars"><span class="dot"></span>Акси на авто</button>
            <button class="chip" type="button" data-category="staffs"><span class="dot"></span>Посохи</button>
            <button class="chip" type="button" data-category="backpacks"><span class="dot"></span>Рюкзаки</button>
            <button class="chip" type="button" data-category="accs"><span class="dot"></span>Акси</button>
            <button class="chip" type="button" data-category="cases"><span class="dot"></span>Кейси</button>
            <button class="chip" type="button" data-category="other"><span class="dot"></span>Інше</button>
        </div>
    </div>

    <div id="accounts-grid" class="accounts-grid"></div>

</div>

<script src="accsdata.js"></script>
<script src="accs.js"></script>
