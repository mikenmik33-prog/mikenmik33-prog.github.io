<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f1115;
    color: #e6e8eb;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 16px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  p.sub { color: #9aa1ab; margin-top: 0; margin-bottom: 32px; text-align: center; }
  .modules {
    display: grid;
    gap: 12px;
    width: 100%;
    max-width: 420px;
  }
  .module {
    display: block;
    padding: 16px 18px;
    border-radius: 12px;
    background: #1a1d24;
    border: 1px solid #262a33;
    color: inherit;
    text-decoration: none;
  }
  .module.disabled {
    opacity: 0.5;
    pointer-events: none;
  }
  .module-name { font-weight: 600; }
  .module-desc { color: #9aa1ab; font-size: 0.9rem; margin-top: 4px; }
</style>
</head>
<body>
  <h1>Hub</h1>
  <p class="sub">Усі застосунки в одному місці</p>
  <div class="modules">
    <a class="module disabled" href="#">
      <div class="module-name">Записничок</div>
      <div class="module-desc">Скоро</div>
    </a>
  </div>
</body>
</html>
